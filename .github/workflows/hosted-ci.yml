name: hosted-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted:
    name: Hosted-safe .NET build and tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore hosted solution
        run: dotnet restore SolidWorksMcp.hosted.slnx

      - name: Verify formatting
        run: dotnet format SolidWorksMcp.hosted.slnx --no-restore --verify-no-changes --severity info

      - name: Build hosted solution
        run: dotnet build SolidWorksMcp.hosted.slnx --configuration Release --no-restore

      - name: Run hosted tests
        run: dotnet test SolidWorksMcp.hosted.slnx --configuration Release --no-build --logger "trx;LogFileName=hosted.trx"

      - name: Upload hosted test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-test-evidence
          if-no-files-found: warn
          path: |
            **/TestResults/*.trx
            **/bin/**/hosted.trx
